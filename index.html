<html lang="en">

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>&#x1F3E0; Alshather Control App</title>
<style>
:root{--bg:#f9fafb;--card:#fff;--sec:#f3f4f6;--s-ok:#f0fdf4;--s-warn:#fffbeb;--s-danger:#fef2f2;--s-info:#eff6ff;--s-purple:#f5f3ff;--text:#111827;--muted:#6b7280;--c-ok:#16a34a;--c-warn:#d97706;--c-danger:#dc2626;--c-info:#2563eb;--c-purple:#7c3aed;--ch-in:#2563eb;--ch-out:#e8590c;--border:#e5e7eb;--radius:12px;--rsm:8px;}
@media(prefers-color-scheme:dark){:root{--bg:#0f172a;--card:#1e293b;--sec:#334155;--s-ok:#052e1690;--s-warn:#451a0390;--s-danger:#450a0a90;--s-info:#1e3a5f90;--s-purple:#3b076490;--text:#f1f5f9;--muted:#94a3b8;--c-ok:#4ade80;--c-warn:#fbbf24;--c-danger:#f87171;--c-info:#60a5fa;--c-purple:#a78bfa;--ch-in:#3f83e6;--ch-out:#dd6b26;--border:#334155;}}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);min-height:100vh;color:var(--text)}
input,select{width:100%;padding:9px 12px;border-radius:var(--rsm);border:1px solid var(--border);font-size:14px;color:var(--text);outline:none;background:var(--card);font-family:inherit}
input:focus,select:focus{border-color:var(--c-info)}
.card{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);padding:20px}
.btn{padding:9px 18px;border-radius:var(--rsm);border:none;cursor:pointer;font-size:14px;font-weight:500;font-family:inherit;display:inline-flex;align-items:center;gap:6px}
.btn-p{background:#2563eb;color:#fff}.btn-g{background:transparent;color:var(--text);border:1px solid var(--border)}.btn-sm{padding:6px 12px;font-size:13px}
.overlay{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);padding:24px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto}
.tab{padding:12px 16px;border:none;background:none;cursor:pointer;font-size:13px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;font-family:inherit}
.tab.on{color:#2563eb;border-bottom-color:#2563eb}
.badge{display:inline-flex;align-items:center;padding:3px 8px;border-radius:99px;font-size:11px;font-weight:500;cursor:pointer;border:none;font-family:inherit}
.b-ok{background:var(--s-ok);color:var(--c-ok)}.b-warn{background:var(--s-warn);color:var(--c-warn)}.b-danger{background:var(--s-danger);color:var(--c-danger)}.b-purple{background:var(--s-purple);color:var(--c-purple)}
.mtoggle{padding:7px 10px;border-radius:var(--rsm);font-size:12px;cursor:pointer;font-family:inherit;font-weight:500;border:1px solid var(--border);background:var(--card);color:var(--muted);text-align:left;width:100%}
.mtoggle.paid{background:var(--s-ok);color:var(--c-ok);border-color:transparent}
.pill{font-size:10px;padding:2px 7px;border-radius:99px;font-weight:600}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;display:inline-block}

/* RTL support */
html[dir="rtl"] body{direction:rtl;text-align:right}
html[dir="rtl"] .badge,html[dir="rtl"] .pill{direction:rtl}
html[dir="rtl"] input,html[dir="rtl"] select,html[dir="rtl"] textarea{text-align:right;direction:rtl}
html[dir="rtl"] input[type="number"],html[dir="rtl"] input[type="date"],html[dir="rtl"] input[type="month"]{direction:ltr;text-align:right}
html[dir="rtl"] .tabs{flex-direction:row-reverse}
html[dir="rtl"] .amt,html[dir="rtl"] .num{direction:ltr;display:inline-block}
.langbtn{background:var(--sec);border:1px solid var(--border);border-radius:99px;padding:4px 10px;font-size:12px;font-weight:500;cursor:pointer;color:var(--muted);font-family:inherit}
.langbtn:hover{color:var(--fg)}
@media(max-width:480px){.tab{padding-left:8px!important;padding-right:8px!important;font-size:12.5px!important}}
</style>
</head>
<body>
<div id="root"></div>
<script>
const N=16,LS_DATA='aca-v3',LS_FB='aca-fb',LS_ADM='aca-admin';
const TRASH=`<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>`;
const CLOSE=`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`;
const gid=()=>`${Date.now()}-${Math.random().toString(36).slice(2,7)}`;
const fmt=n=>'SAR '+(+n||0).toLocaleString('en',{minimumFractionDigits:2,maximumFractionDigits:2});
const nowM=()=>new Date().toISOString().slice(0,7);
const nowD=()=>new Date().toISOString().slice(0,10);
const mLbl=ym=>new Date(ym+'-01').toLocaleDateString('en',{month:'long',year:'numeric'});
function addM(ym,n){const[y,m]=ym.split('-').map(Number);const t=m-1+n;return`${y+Math.floor(t/12)}-${String((t%12)+1).padStart(2,'0')}`;}

// Admin
let isAdmin=localStorage.getItem(LS_ADM)==='true';
async function hashPw(pw){const d=new TextEncoder().encode(pw+':aca-salt-2025');const b=await crypto.subtle.digest('SHA-256',d);return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');}
function setAdmin(v){isAdmin=v;localStorage.setItem(LS_ADM,v?'true':'false');render();}

function openUnlockModal(cb){
  let pw='';
  const err=el('div',{style:{color:'var(--c-danger)',fontSize:'13px',marginTop:'8px',display:'none'}},[t('Incorrect password.')]);
  const pi=document.createElement('input');pi.type='password';pi.placeholder=t('Admin password');pi.addEventListener('input',e=>pw=e.target.value);pi.addEventListener('keydown',e=>{if(e.key==='Enter')go();});
  const btn=el('button',{class:'btn btn-p',style:{width:'100%'}},[t('Unlock')]);
  async function go(){
    if(!pw)return;
    if(!state.adminHash){setAdmin(true);modalEl&&(modalEl.remove(),modalEl=null);cb&&cb();return;}
    const h=await hashPw(pw);
    if(h===state.adminHash){setAdmin(true);modalEl&&(modalEl.remove(),modalEl=null);cb&&cb();}
    else{err.style.display='block';pi.value='';pw='';}
  }
  btn.addEventListener('click',go);
  const note=!state.adminHash
    ?el('div',{style:{background:'var(--s-info)',borderRadius:'var(--rsm)',padding:'10px 12px',marginBottom:'12px',fontSize:'13px',color:'var(--c-info)'}},[`No password set \u2014 click Unlock to enter admin mode.`])
    :el('div',{style:{fontSize:'13px',color:'var(--muted)',marginBottom:'12px'}},[t('Enter the admin password to enable editing.')]);
  showModal('&#x1F512; Unlock Editing',el('div',[note,fw(t('Password'),pi),btn,err]));
}

function openSetPwModal(){
  let p1='',p2='';
  const err=el('div',{style:{color:'var(--c-danger)',fontSize:'13px',marginTop:'8px',display:'none'}});
  const i1=document.createElement('input');i1.type='password';i1.placeholder=t('New password (min 4 chars)');i1.addEventListener('input',e=>p1=e.target.value);
  const i2=document.createElement('input');i2.type='password';i2.placeholder=t('Confirm password');i2.addEventListener('input',e=>p2=e.target.value);
  const btn=el('button',{class:'btn btn-p',style:{width:'100%'}},[t('Save password')]);
  btn.addEventListener('click',async()=>{
    if(p1.length<4){err.textContent=t('Min 4 characters.');err.style.display='block';return;}
    if(p1!==p2){err.textContent=t('Passwords do not match.');err.style.display='block';return;}
    const h=await hashPw(p1);
    upd(s=>({...s,adminHash:h}));modalEl&&(modalEl.remove(),modalEl=null);
  });
  showModal(t('Set Admin Password'),el('div',[
    el('div',{style:{background:'var(--s-warn)',borderRadius:'var(--rsm)',padding:'10px 12px',marginBottom:'14px',fontSize:'13px',color:'var(--c-warn)'}},[`Share this password only with those who need to edit. Others will be read-only observers.`]),
    fw(t('New password'),i1),fw(t('Confirm'),i2),btn,err
  ]));
}

// State
const INIT={members:[
  {id:'m1',name:'Abdulrahman'},{id:'m2',name:'Mohammed'},{id:'m3',name:'Abdulaziz'},
  {id:'m4',name:'Turki'},{id:'m5',name:'Haitham'},{id:'m6',name:'Bader'},
  {id:'m7',name:'Meshari'},{id:'m8',name:'Sultan'},{id:'m9',name:'Meshal'},
  {id:'m10',name:'Saleh'},{id:'m11',name:'Waleed'},{id:'m12',name:'Faisal'},
  {id:'m13',name:'Amir'},{id:'m14',name:'Nawaf'},{id:'m15',name:'Fahad'},{id:'m16',name:'Saad'}
],treasurer:'m1',adminHash:null,rentPeriods:[],expenses:[],settlements:[],rentPayments:{},qattahs:[],
gathering:{groups:['Abdulaziz & Turki','Mohammed & Abdulrahman','Haitham & Bader','Meshari & Sultan','Meshal & Saleh','Waleed & Faisal','Amir & Nawaf','Fahad & Saad'],anchorDate:'2026-06-23',anchorGroup:3,skipped:[]},
planAmounts:{A:200,B:75,rentLump:750},
activity:[]
};
function migrate(s){
  if(!s)return JSON.parse(JSON.stringify(INIT));
  return{
    members:(s.members||INIT.members).map(m=>({...m,plan:m.plan!==undefined?m.plan:null})),
    planAmounts:(()=>{const q={A:200,B:75,rentLump:750,...(s.planAmounts||{})};if(!q.start)q.start=addM(nowM(),1);if(!q.landlordMonth)q.landlordMonth=nowM();if(q.landlord==null){const rps=[...(s.rentPeriods||[])].sort((a,b)=>b.startMonth.localeCompare(a.startMonth));q.landlord=rps[0]?rps[0].amount6m:12000;}return q;})(),
    dues:s.dues||{},
    opening:s.opening||null,
    duesSnap:s.duesSnap||{},
    treasurer:s.treasurer!==undefined?s.treasurer:'m1',
    adminHash:s.adminHash||null,
    rentPeriods:s.rentPeriods||[],
    expenses:(s.expenses||[]).map(e=>{
      const b={...e,paidMembers:e.paidMembers||(e.paidBy?[e.paidBy]:[]),poolSettled:e.poolSettled||false};
      if(b.recurring){
        if(b.recPaid===undefined){
          // derive initial state from any legacy markers, else pending
          if(b.poolSettled)b.recPaid='pool';
          else if(b.paidBy){b.recPaid='member';b.recPaidBy=b.paidBy;}
          else b.recPaid='unpaid';
        }
        if(b.recPaid!=='member'){b.recPaidBy=null;}
        // recurring uses recPaidBy, never the per-member split path
        b.paidBy=null;b.paidMembers=[];
      }
      return b;
    }),
    settlements:(s.settlements||[]).map(st=>{
      if(st.type==='pool_receive'&&!st.source){
        const n=(st.note||'');
        st={...st,source:/[Rr]ent|\u0625\u064a\u062c\u0627\u0631/.test(n)?'rent':/[Qq]attah|\u0642\u0637\u0629/.test(n)?'qattah':'qattah'};
      }
      return st;
    }),
    rentPayments:(()=>{const rp={};Object.keys(s.rentPayments||{}).forEach(mk=>{const v=s.rentPayments[mk];if(Array.isArray(v)){const obj={};v.forEach(id=>obj[id]={status:'paid',settlementId:null});rp[mk]=obj;}else{rp[mk]=v||{};}});return rp;})(),
    qattahs:(s.qattahs||[]).map(q=>({...q,shares:(q.shares||[]).map(sh=>({...sh,settled:sh.settled!==undefined?sh.settled:(sh.paid||false),settledBy:sh.settledBy||null,cashSettlementId:sh.cashSettlementId||null,partialPaid:sh.partialPaid||0,partialIds:sh.partialIds||[]}))})),
    gathering:s.gathering?{...INIT.gathering,...s.gathering,swaps:s.gathering.swaps||{}}:INIT.gathering,
    activity:(s.activity||[]).slice(-200),
  };
}

// Firebase (REST + anonymous auth)
let DB_URL=null,FB_KEY=null,evtSrc=null,fbOnline=false,justWrote=false;
let fbToken=null,fbTokenExp=0,authTimer=null;
const isValidFb=u=>u&&u.startsWith('https://')&&(u.includes('firebaseio.com')||u.includes('firebasedatabase.app'));
const fbPath=()=>DB_URL+'/aca.json'+(fbToken?'?auth='+fbToken:'');

// Anonymous authentication: sign in silently, refresh before expiry
async function fbAuth(){
  if(!FB_KEY)return null; // no key configured -> open-rules mode (legacy)
  if(fbToken&&Date.now()<fbTokenExp)return fbToken;
  const savedRefresh=localStorage.getItem('aca-fbrt');
  try{
    if(savedRefresh){
      // Refresh existing anonymous session
      const r=await fetch('https://securetoken.googleapis.com/v1/token?key='+FB_KEY,{
        method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},
        body:'grant_type=refresh_token&refresh_token='+encodeURIComponent(savedRefresh)});
      if(r.ok){const d=await r.json();fbToken=d.id_token;fbTokenExp=Date.now()+(+d.expires_in)*1000-300000;localStorage.setItem('aca-fbrt',d.refresh_token);scheduleAuthRefresh();return fbToken;}
      localStorage.removeItem('aca-fbrt'); // refresh failed -> new anon account
    }
    // Create new anonymous session
    const r=await fetch('https://identitytoolkit.googleapis.com/v1/accounts:signUp?key='+FB_KEY,{
      method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({returnSecureToken:true})});
    if(!r.ok)throw new Error('auth failed');
    const d=await r.json();fbToken=d.idToken;fbTokenExp=Date.now()+(+d.expiresIn)*1000-300000;localStorage.setItem('aca-fbrt',d.refreshToken);scheduleAuthRefresh();return fbToken;
  }catch(e){fbToken=null;return null;}
}
function scheduleAuthRefresh(){
  if(authTimer)clearTimeout(authTimer);
  const ms=Math.max(fbTokenExp-Date.now(),60000);
  authTimer=setTimeout(async()=>{fbToken=null;await fbAuth();if(DB_URL)fbSub();},ms);
}
async function fbRead(){await fbAuth();const r=await fetch(fbPath());if(!r.ok)throw new Error();return r.json();}
async function fbWrite(d){await fbAuth();justWrote=true;setTimeout(()=>justWrote=false,3500);await fetch(fbPath(),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});}
async function fbSub(){
  await fbAuth();
  if(evtSrc)evtSrc.close();
  evtSrc=new EventSource(fbPath());
  evtSrc.onopen=()=>{fbOnline=true;rdot();};
  evtSrc.onerror=()=>{fbOnline=false;rdot();};
  evtSrc.addEventListener('auth_revoked',async()=>{fbToken=null;await fbAuth();fbSub();});
  evtSrc.addEventListener('cancel',async()=>{fbToken=null;await fbAuth();fbSub();});
  evtSrc.addEventListener('put',e=>{if(justWrote)return;try{const d=JSON.parse(e.data);const raw=typeof d.data==='string'?JSON.parse(d.data):d.data;if(raw){state=migrate(raw);lsS();render();}}catch{}});
}
// Daily backups: snapshot state to /aca-backups/{date}.json, keep last 7
async function fbSnapshot(){
  if(!DB_URL)return;
  const today=nowD();
  if(localStorage.getItem('aca-lastsnap')===today)return;
  try{
    await fbAuth();
    await fetch(DB_URL+'/aca-backups/'+today+'.json'+(fbToken?'?auth='+fbToken:''),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(state)});
    localStorage.setItem('aca-lastsnap',today);
    // prune: keep last 7
    const r=await fetch(DB_URL+'/aca-backups.json?shallow=true'+(fbToken?'&auth='+fbToken:''));
    if(r.ok){const keys=Object.keys(await r.json()||{}).sort();
      for(const k of keys.slice(0,-7))await fetch(DB_URL+'/aca-backups/'+k+'.json'+(fbToken?'?auth='+fbToken:''),{method:'DELETE'});}
  }catch{}
}
async function listBackups(){
  if(!DB_URL)return [];
  try{await fbAuth();const r=await fetch(DB_URL+'/aca-backups.json?shallow=true'+(fbToken?'&auth='+fbToken:''));
    if(!r.ok)return [];return Object.keys(await r.json()||{}).sort().reverse();}catch{return [];}
}
async function restoreBackup(dateKey){
  await fbAuth();
  const r=await fetch(DB_URL+'/aca-backups/'+dateKey+'.json'+(fbToken?'?auth='+fbToken:''));
  if(!r.ok)throw new Error();
  const snap=await r.json();if(!snap)throw new Error();
  await upd(()=>migrate(snap),'restored data from backup '+dateKey);
}

// Business logic
function calcBal(){
  const b={};state.members.forEach(m=>b[m.id]=0);const _F=freshMode(),_k=d=>!_F||inNew(d);
  state.expenses.filter(e=>e.paidBy&&!e.recurring&&e.model!=='pool'&&_k(e.date||e.month)).forEach(({amount,paidBy,paidMembers})=>{
    const sh=amount/N;const paid=new Set(paidMembers||[]);paid.add(paidBy);
    const unpaidCount=state.members.filter(m=>!paid.has(m.id)).length;
    b[paidBy]+=unpaidCount*sh;
  });
  // Pool-model expense paid by a member -> the group owes him the full amount (his credit)
  state.expenses.forEach(e=>{if(e.model==='pool'&&!e.recurring&&e.paidBy&&_k(e.date||e.month))b[e.paidBy]+=+e.amount;});
  // Recurring expense paid by a member -> pool owes them the full amount
  state.expenses.forEach(e=>{if(e.recurring&&e.recPaid==='member'&&e.recPaidBy&&_k(e.month))b[e.recPaidBy]+=e.amount;});
  state.qattahs.forEach(q=>{if(!_k(q.month))return;q.shares.forEach(s=>{b[s.memberId]-=s.amount;});});
  state.settlements.forEach(s=>{if(!_k(s.date))return;
    if(s.type==='pool_receive')b[s.memberId]+=+s.amount;
    else if(s.type==='pool_pay')b[s.memberId]-=+s.amount;
    else if(s.type==='member_owes')b[s.memberId]-=+s.amount;
    else if(s.from&&s.to){b[s.from]+=+s.amount;b[s.to]-=+s.amount;}
  });
  // Rent: evaluate EVERY period (past + active), each month up to the current month.
  // A finished period whose months are unpaid stays overdue in the balance.
  const _ps=planStartM();
  state.rentPeriods.forEach(_rp=>{if(_rp.startMonth>=_ps||_F)return;const _ms=_rp.amount6m/N/6;for(let i=0;i<6;i++){const mk=addM(_rp.startMonth,i);if(mk>nowM())break;const md=state.rentPayments[mk]||{};state.members.forEach(m=>{const e=Array.isArray(md)?null:md[m.id];if(e?.status==='paid'&&!e?.settlementId)return;b[m.id]-=_ms;});}});
  // Monthly dues (plan): each due is owed; cash payments bring money in; credit payments use his credit

// Firebase setup
function openSetupModal(){
  let fbUrl=localStorage.getItem(LS_FB)||'';
  let apiKey=localStorage.getItem('aca-fbkey')||'';
  const errEl=el('div',{style:{color:'var(--c-danger)',fontSize:'13px',marginTop:'8px',display:'none',lineHeight:'1.6'}});
  const ui=mki('url','https://your-project-default-rtdb.firebaseio.com',fbUrl,v=>fbUrl=v.trim());
  const ki=mki('text',t('AIza... (Web API Key, optional but recommended)'),apiKey,v=>apiKey=v.trim());ki.value=apiKey;
  // Quick setup: paste a share link and both fields fill automatically
  const pasteInput=mki('text',t('Paste a share link here (fastest)'),'',v=>{
    const raw=v.trim();if(!raw)return;
    try{
      const h=raw.includes('#')?raw.split('#')[1]:raw;
      const dec=atob(h);
      let u=null,k=null;
      if(dec.startsWith('{')){const p=JSON.parse(dec);u=p.u;k=p.k||'';}else u=dec;
      if(isValidFb(u)){fbUrl=u;ui.value=u;if(k){apiKey=k;ki.value=k;}
        errEl.style.color='var(--c-ok)';errEl.innerHTML='\u2713 Link read \u2014 fields filled. Now tap Connect.';errEl.style.display='block';}
    }catch{}
  });
  const cBtn=el('button',{class:'btn btn-p',style:{width:'100%',marginTop:'4px'}},[t('Connect and enable live sync')]);
  cBtn.addEventListener('click',async()=>{
    errEl.style.display='none';const clean=fbUrl.replace(/\/$/,'');
    if(!isValidFb(clean)){errEl.innerHTML='URL must start with https:// and end with .firebaseio.com or .firebasedatabase.app';errEl.style.display='block';return;}
    cBtn.textContent=t('Connecting...');cBtn.disabled=true;
    try{
      // Store key first so fbAuth can use it during the test
      FB_KEY=apiKey||null;
      if(FB_KEY)localStorage.setItem('aca-fbkey',FB_KEY);else localStorage.removeItem('aca-fbkey');
      fbToken=null;fbTokenExp=0;

      DB_URL=clean;localStorage.setItem(LS_FB,clean);
      history.replaceState(null,'',location.pathname+'#'+btoa(FB_KEY?JSON.stringify({u:clean,k:FB_KEY}):clean));
      // SAFE CONNECT: if the database already has data, adopt it - never overwrite
      let remote=null;try{remote=await fbRead();}catch{}
      const remoteHasData=remote&&((remote.expenses||[]).length||(remote.qattahs||[]).length||(remote.settlements||[]).length||(remote.rentPeriods||[]).length||(remote.members||[]).some(m=>m&&m.name&&!/^Person \d+$/.test(m.name)));
      if(remoteHasData){state=migrate(remote);lsS();}
      else{await fbWrite(state);}
      fbSub();updateManifest();modalEl&&(modalEl.remove(),modalEl=null);render();
    }catch(e){errEl.innerHTML=e.message==='auth'
      ?'Permission denied. Either: (1) your rules require auth \u2014 paste your Web API Key above and make sure Anonymous sign-in is enabled in Firebase Authentication, or (2) set the rules to allow authenticated access.'
      :'Could not connect. Check the Database URL (Firebase Console > Realtime Database > Data tab) and the API key (Project settings > General > Web API Key).';
      errEl.style.display='block';cBtn.textContent=t('Connect and enable live sync');cBtn.disabled=false;}
  });
  showModal(t('Enable Live Sharing'),el('div',[
    el('div',{style:{background:'var(--s-info)',borderRadius:'var(--rsm)',padding:'14px',marginBottom:'16px'}},[
      el('div',{style:{fontWeight:'500',color:'var(--c-info)',marginBottom:'8px'}},[t('Secure setup (recommended)')]),
      el('ol',{style:{paddingLeft:'18px',lineHeight:'2',fontSize:'13px',color:'var(--muted)'}},
        ['Firebase Console > Build > Authentication > Get started > Sign-in method > enable Anonymous',
         'Project settings (gear icon) > General > copy Web API Key',
         'Realtime Database > Rules > set read/write to: auth != null > Publish',
         'Paste Database URL and API Key below and click Connect'].map(s=>el('li',{},[s])))
    ]),fw(t('Quick setup — paste share link'),pasteInput),fw(t('Firebase Database URL'),ui),fw(t('Web API Key'),ki),cBtn,errEl
  ]));
}

// Qattah
// ── Monthly dues model ──────────────────────────────────────────────
// From the plan start month, each member owes ONE monthly payment set by their plan:
//   Plan A: planAmounts.A every month (includes rent share)
//   Plan B: planAmounts.B every month + planAmounts.rentLump in landlord months
// Payments: state.dues[YYYY-MM][memberId] = {how:'cash'|'credit', amt, rentPart, date}
//   'credit' = covered by money the member already put in for group expenses (replaces Settle).
// Past months are frozen in state.duesSnap so later changes to plans/amounts don't rewrite history.
const LL=(a,b)=>lang==='ar'?a:b;
function mIdx(ym){const p=ym.split('-').map(Number);return p[0]*12+(p[1]-1);}
function planMonthIdx(ym){return mIdx(ym);}
function pa(){return state.planAmounts||{};}
function planStartM(){return pa().start||addM(nowM(),1);}
function planActive(){return planStartM()<=nowM();}
function latestRP(){return [...(state.rentPeriods||[])].sort((a,b)=>b.startMonth.localeCompare(a.startMonth))[0]||null;}
function landlordAmt(){const v=pa().landlord;if(v!=null&&v!=='')return +v;const rp=latestRP();return rp?rp.amount6m:0;}
function landlordAnchor(){return pa().landlordMonth||(latestRP()?latestRP().startMonth:null);}
function isLandlordMonth(mk){const a=landlordAnchor();if(!a)return false;const d=mIdx(mk)-mIdx(a);return d>=0&&d%6===0;}
function nextLandlord(from){let m=from||nowM();for(let i=0;i<13;i++){if(isLandlordMonth(m))return m;m=addM(m,1);}return null;}
function duesMonths(upTo){const s=planStartM(),e=upTo||nowM();const out=[];if(s>e)return out;let m=s,g=0;while(m<=e&&g<240){out.push(m);m=addM(m,1);g++;}return out;}
function duesCfgLive(){const p=pa();const ll=landlordAmt();
  return {A:+p.A||0,B:+p.B||0,lump:p.rentLump!=null&&p.rentLump!==''?+p.rentLump:Math.round(ll/N),rentPM:ll/N/6,
    plans:Object.fromEntries(state.members.map(m=>[m.id,m.plan||null]))};}
function duesFor(mk){
  const snap=(state.duesSnap||{})[mk];const c=snap||duesCfgLive();
  const isRent=isLandlordMonth(mk);const pays=((state.dues||{})[mk])||{};
  const rows=[];
  state.members.forEach(m=>{const plan=c.plans[m.id];if(plan!=='A'&&plan!=='B')return;
    const pay=pays[m.id]||null;
    let amt=plan==='A'?c.A:c.B+(isRent?c.lump:0);
    let rentPart=plan==='A'?c.rentPM:(isRent?c.lump:0);
    if(pay&&pay.amt!=null){amt=+pay.amt;if(pay.rentPart!=null)rentPart=+pay.rentPart;}
    rows.push({m:m.id,name:m.name,plan,amt,rentPart,pay});});
  return {mk,isRent,rows,cfg:c};
}
// Freeze months that have ended (called on load)
function rollDues(){
  const cur=nowM();const snaps={...(state.duesSnap||{})};let changed=false;
  duesMonths().forEach(mk=>{if(mk<cur&&!snaps[mk]){snaps[mk]=duesCfgLive();changed=true;}});
  if(changed){state={...state,duesSnap:snaps};lsS();}
}
function setDuePay(mk,mid,how){
  const r=duesFor(mk).rows.find(x=>x.m===mid);if(!r)return;
  upd(p=>{const dues={...(p.dues||{})};const mm={...(dues[mk]||{})};
    if(how)mm[mid]={how,amt:r.amt,rentPart:r.rentPart,date:nowD()};else delete mm[mid];
    dues[mk]=mm;return {...p,dues};},
    how?('recorded '+r.name+' '+mk+' '+(how==='cash'?'cash':'from credit')+' '+Math.round(r.amt)):('undid '+r.name+' '+mk+' payment'));
}
// New chapter: an opening balance entered by the treasurer replaces the old Qattah-round bookkeeping.
// Everything dated before the plan start month belongs to the old chapter and is summarised by that number.
function opening(){return state.opening&&state.opening.set?state.opening:null;}
function freshMode(){const o=opening();return !!(o&&o.carry===false);}
function inNew(d){return (d||'')>=planStartM();}
function expSpent(e){if(e.recurring)return (e.recPaid==='pool'||e.recPaid==='member')?(+e.amount||0):0;return +e.amount||0;}
// Two pots: rent reserve (for the landlord) and expenses pool (everything else)
function poolsNow(){
  const q=qPool();let duesIn=0,rentIn=0;
  duesMonths().forEach(mk=>duesFor(mk).rows.forEach(r=>{if(r.pay){duesIn+=r.amt;rentIn+=r.rentPart;}}));
  let landlordOut=0;duesMonths().forEach(mk=>{if(isLandlordMonth(mk))landlordOut+=landlordAmt();});
  let rentReserve=rentIn-landlordOut,expensesPool=q.bal+duesIn-rentIn,spent=0,extraIn=0;
  const o=opening();
  if(o){
    spent=state.expenses.filter(e=>inNew(e.date||e.month)).reduce((s,e)=>s+expSpent(e),0);
    const qc=new Set();state.qattahs.forEach(x=>x.shares.forEach(s=>{if(s.cashSettlementId)qc.add(s.cashSettlementId);}));
    extraIn=state.settlements.filter(s=>s.type==='pool_receive'&&s.source!=='rent'&&!qc.has(s.id)&&inNew(s.date)).reduce((a,s)=>a+(+s.amount||0),0);
    rentReserve=(+o.rent||0)+rentIn-landlordOut;
    expensesPool=(+o.exp||0)+duesIn-rentIn-spent+extraIn;
  }
  return {rentReserve,expensesPool,total:rentReserve+expensesPool,duesIn,rentIn,landlordOut,spent,extraIn,opening:o};
}
function nextPlanLandlord(){return nextLandlord(planActive()?nowM():planStartM());}
function freqLbl(n){n=+n||1;return n===1?LL('كل شهر','Monthly'):n===2?LL('كل شهرين','Every 2 months'):LL('كل '+n+' أشهر','Every '+n+' months');}
function duesMonthTotals(mk){const d=duesFor(mk);let due=0,got=0,np=0;d.rows.forEach(r=>{due+=r.amt;if(r.pay)got+=r.amt;else np++;});return {due,got,unpaid:np,count:d.rows.length,isRent:d.isRent};}

// ── Forecast ──
function planCfg(){const c=duesCfgLive();return {A:c.A,B:c.B,rentLump:c.lump,rentPM:c.rentPM,start:planStartM(),landlord:landlordAmt(),anchor:landlordAnchor()};}
// Active recurring series = latest entry of each recurringId still marked recurring
function recurringActive(){
  const by={};
  state.expenses.forEach(e=>{if(e.type==='monthly'&&e.recurringId){const c=by[e.recurringId];if(!c||e.month>c.month)by[e.recurringId]=e;}});
  return Object.values(by).filter(e=>e.recurring).map(e=>({...e,everyN:Math.max(1,+e.everyN||1)}));
}
function planForecast(months){
  months=months||12;
  const c=planCfg();
  let cA=0,cB=0,cNone=0;const names={A:[],B:[],none:[]};
  state.members.forEach(m=>{if(m.plan==='A'){cA++;names.A.push(m.name);}else if(m.plan==='B'){cB++;names.B.push(m.name);}else{cNone++;names.none.push(m.name);}});
  const rec=recurringActive();
  const recM=rec.reduce((s,e)=>s+(+e.amount||0)/e.everyN,0);
  const monthlyPool=cA*c.A+cB*c.B;
  const buffer=monthlyPool-recM-cA*c.rentPM;
  const pools=poolsNow();
  const startBal=pools.total;
  const first=planStartM()>nowM()?planStartM():addM(nowM(),1);
  let bal=startBal;const rows=[];
  for(let i=0;i<months;i++){
    const mk=addM(first,i);
    const isRent=isLandlordMonth(mk);
    const inLump=isRent?cB*c.rentLump:0,outRent=isRent?c.landlord:0;
    const outFixed=rec.reduce((s,e)=>{const d=mIdx(mk)-mIdx(e.month);return s+(d>0&&d%e.everyN===0?(+e.amount||0):0);},0);
    const income=monthlyPool+inLump,expenses=outFixed+outRent;
    bal+=income-expenses;
    rows.push({mk,income,expenses,bal,isRent,inMonthly:monthlyPool,inLump,outFixed,outRent});
  }
  return {cA,cB,cNone,names,monthlyPool,recM,rec,buffer,rows,startBal,cfg:c,pools,
    rentLumps6mo:cB*c.rentLump,nextRent:rows.find(r=>r.isRent)||null,
    lowest:rows.reduce((m,r)=>r.bal<m.bal?r:m,rows[0]||{bal:startBal})};
}

const planFmt=v=>'SAR '+Math.round(+v||0).toLocaleString('en');
function planMonthShort(mk){const p=mk.split('-').map(Number);return new Date(p[0],p[1]-1,1).toLocaleDateString(lang==='ar'?'ar-SA-u-ca-gregory-nu-latn':'en',{calendar:'gregory',month:'short'});}

function planChartSVG(f){
  const rows=f.rows,n=rows.length;if(!n)return '';
  const W=620,H=250,pL=58,pR=14,pT=14,pB=42;
  const vals=[0,f.startBal];rows.forEach(r=>{vals.push(r.income,r.expenses,r.bal);});
  let mx=Math.max(...vals),mn=Math.min(...vals);
  const raw=(mx-mn)/4||1,p10=Math.pow(10,Math.floor(Math.log10(raw)));
  const step=[1,2,2.5,5,10].map(k=>k*p10).find(s=>raw<=s);
  const yMin=Math.floor(mn/step)*step,yMax=Math.ceil(mx/step)*step||step;
  const y=v=>pT+(yMax-v)/(yMax-yMin)*(H-pT-pB);
  const colW=(W-pL-pR)/n,bw=Math.max(5,Math.min(14,(colW-12)/2));
  const cx=i=>pL+colW*(i+.5);
  const y0=y(0);
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;min-width:540px;font-family:inherit" role="img" aria-label="forecast">`;
  if(yMin<0)s+=`<rect x="${pL}" y="${y0}" width="${W-pL-pR}" height="${y(yMin)-y0}" style="fill:var(--s-danger)"/>`;
  s+=`<rect class="pc-hl" x="${pL}" y="${pT}" width="${colW}" height="${H-pT-pB}" style="fill:var(--sec);opacity:0"/>`;
  for(let v=yMin;v<=yMax+1e-9;v+=step){
    const yy=y(v).toFixed(1),zero=Math.abs(v)<1e-9;
    s+=`<line x1="${pL}" x2="${W-pR}" y1="${yy}" y2="${yy}" style="stroke:${zero?'var(--muted)':'var(--border)'};stroke-width:1"/>`;
    s+=`<text x="${pL-8}" y="${(+yy+4).toFixed(1)}" text-anchor="end" style="fill:var(--muted);font-size:11px">${Math.round(v).toLocaleString('en')}</text>`;
  }
  const bar=(x,v,cls)=>{if(v<=0)return '';const t=y(v),h=y0-t,r=Math.min(4,bw/2,h);
    return `<path d="M${x},${y0} V${t+r} Q${x},${t} ${x+r},${t} H${x+bw-r} Q${x+bw},${t} ${x+bw},${t+r} V${y0} Z" style="fill:var(${cls})"/>`;};
  rows.forEach((r,i)=>{
    s+=bar(cx(i)-bw-1,r.income,'--ch-in');
    s+=bar(cx(i)+1,r.expenses,'--ch-out');
    const p=r.mk.split('-');
    s+=`<text x="${cx(i)}" y="${H-pB+16}" text-anchor="middle" style="fill:var(--muted);font-size:10.5px">${planMonthShort(r.mk)}</text>`;
    if(i===0||p[1]==='01')s+=`<text x="${cx(i)}" y="${H-pB+30}" text-anchor="middle" style="fill:var(--muted);font-size:10px">${p[0]}</text>`;
  });
  const pts=rows.map((r,i)=>`${cx(i).toFixed(1)},${y(r.bal).toFixed(1)}`).join(' ');
  s+=`<polyline points="${pts}" style="fill:none;stroke:var(--text);stroke-width:2;stroke-linejoin:round"/>`;
  const last=rows[n-1],lo=rows.indexOf(f.lowest);
  [lo,n-1].forEach(i=>{if(i<0)return;s+=`<circle cx="${cx(i)}" cy="${y(rows[i].bal)}" r="4" style="fill:var(--text);stroke:var(--card);stroke-width:2"/>`;});
  s+=`<text x="${cx(n-1)}" y="${y(last.bal)-9}" text-anchor="end" style="fill:var(--text);font-size:11px;font-weight:600">${Math.round(last.bal).toLocaleString('en')}</text>`;
  rows.forEach((r,i)=>{s+=`<rect class="pc-hit" data-i="${i}" x="${pL+colW*i}" y="${pT}" width="${colW}" height="${H-pT-pB+30}" style="fill:transparent;cursor:pointer"/>`;});
  s+='</svg>';
  return s;
}

// Activity log
function renderActivity(){
  const w=el('div',{style:{padding:'20px',maxWidth:'860px',margin:'0 auto'}});
  // Device name selector (who am I on this device)
  const nameCard=el('div',{class:'card',style:{marginBottom:'16px',display:'flex',justifyContent:'space-between',alignItems:'center',gap:'12px',flexWrap:'wrap'}});
  nameCard.appendChild(el('div',[el('div',{style:{fontWeight:'500',fontSize:'14px'}},[t('Your name on this device')]),el('div',{style:{fontSize:'12px',color:'var(--muted)',marginTop:'2px'}},[t('Actions you take are recorded under this name')])]));
  const sel=mks([['','-- Not set --'],...state.members.map(m=>[m.id,m.name])],v=>{const m=state.members.find(x=>x.id===v);localStorage.setItem('aca-devname',m?m.name:'');});
  const cur=devName();const curM=state.members.find(m=>m.name===cur);if(curM)sel.value=curM.id;
  sel.style.maxWidth='200px';
  nameCard.appendChild(sel);w.appendChild(nameCard);
  // Export / Import data card
  const ioCard=el('div',{class:'card',style:{marginBottom:'16px'}});
  ioCard.appendChild(el('div',{style:{fontWeight:'500',fontSize:'14px',marginBottom:'4px'}},[t('Backup & restore data')]));
  ioCard.appendChild(el('div',{style:{fontSize:'12px',color:'var(--muted)',marginBottom:'10px'}},[t('Export saves a copy of everything to a file. Import replaces ALL current data.')]));
  const ioRow=el('div',{style:{display:'flex',gap:'8px',flexWrap:'wrap'}});
  const expBtn=el('button',{class:'btn btn-g btn-sm'},['\u2B07 '+t('Export to file')]);
  expBtn.addEventListener('click',()=>{
    const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download='alshather-backup-'+nowD()+'.json';
    document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
  });
  ioRow.appendChild(expBtn);
  if(isAdmin){
    const impBtn=el('button',{class:'btn btn-g btn-sm'},['\u2B06 '+t('Import from file')]);
    const fileInput=el('input',{type:'file',accept:'application/json,.json',style:{display:'none'}});
    fileInput.addEventListener('change',e=>{
      const file=e.target.files[0];if(!file)return;
      const reader=new FileReader();
      reader.onload=()=>{
        try{
          const data=JSON.parse(reader.result);
          const payload=data.aca?data.aca:data; // accept firebase-console export or app export
          if(!confirm('Replace ALL current data with the imported file? A snapshot of current data is kept in backups.'))return;
          upd(()=>migrate(payload),t('imported data from file'));
        }catch(err){alert('Could not read that file \u2014 make sure it is a valid JSON backup.');}
      };
      reader.readAsText(file);
    });
    impBtn.addEventListener('click',()=>fileInput.click());
    ioRow.appendChild(impBtn);ioRow.appendChild(fileInput);
  }
  ioCard.appendChild(ioRow);w.appendChild(ioCard);
  // Log entries
  w.appendChild(el('div',{style:{fontWeight:'500',fontSize:'16px',marginBottom:'12px'}},[t('Activity log')]));
  const acts=[...(state.activity||[])].reverse();
  if(!acts.length){w.appendChild(el('div',{class:'card',style:{color:'var(--muted)',fontSize:'13px'}},[t('No activity recorded yet. Actions like payments, new expenses, and edits will appear here.')]));return w;}
  const list=el('div',{style:{background:'var(--card)',borderRadius:'var(--radius)',border:'1px solid var(--border)',overflow:'hidden'}});
  acts.forEach((a,i)=>{
    const d=new Date(a.ts);
    const when=d.toLocaleDateString(lang==='ar'?'ar-SA-u-ca-gregory-nu-latn':'en',{calendar:'gregory',month:'short',day:'numeric'})+' '+d.toLocaleTimeString(lang==='ar'?'ar-SA-u-nu-latn':'en',{hour:'2-digit',minute:'2-digit'});
    const row=el('div',{style:{padding:'10px 16px',borderBottom:i<acts.length-1?'1px solid var(--border)':'none',display:'flex',justifyContent:'space-between',gap:'12px',alignItems:'baseline'}});
    row.appendChild(el('div',{style:{fontSize:'13px',flex:'1'}},[a.who?el('strong',{},[a.who+' ']):'',a.msg]));
    row.appendChild(el('div',{style:{fontSize:'11px',color:'var(--muted)',flexShrink:'0'}},[when]));
    list.appendChild(row);
  });
  w.appendChild(list);
  // Backups card (admin only)
  if(isAdmin&&DB_URL){
    const bc=el('div',{class:'card',style:{marginTop:'16px'}});
    bc.appendChild(el('div',{style:{fontWeight:'500',fontSize:'14px',marginBottom:'4px'}},[t('Daily backups')]));
    bc.appendChild(el('div',{style:{fontSize:'12px',color:'var(--muted)',marginBottom:'10px'}},['A snapshot is saved automatically once per day (last 7 kept). Restore replaces ALL current data.']));
    const holder=el('div',{style:{fontSize:'13px',color:'var(--muted)'}},[t('Loading backups...')]);
    bc.appendChild(holder);
    listBackups().then(keys=>{
      holder.innerHTML='';
      if(!keys.length){holder.textContent=t('No backups yet — the first one is created on next app load.');return;}
      keys.forEach(k=>{
        const row=el('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'7px 0',borderBottom:'1px solid var(--border)'}});
        row.appendChild(el('div',{style:{fontSize:'13px',fontWeight:'500'}},[k]));
        const rb=el('button',{class:'btn btn-g btn-sm'},[t('Restore')]);
        rb.addEventListener('click',async()=>{
          if(!confirm(t('Replace ALL current data with the backup from ')+k+'? This cannot be undone (though today\u2019s snapshot still exists).'))return;
          rb.textContent=t('Restoring...');rb.disabled=true;
          try{await restoreBackup(k);}catch{rb.textContent=t('Failed');setTimeout(()=>{rb.textContent=t('Restore');rb.disabled=false;},2000);}
        });
        row.appendChild(rb);holder.appendChild(row);
      });
    });
    w.appendChild(bc);
  }
  return w;
}
function render(){const root=document.getElementById('root');root.innerHTML='';if(!state){root.innerHTML='<div style="padding:40px;text-align:center;color:var(--muted)">Loading...</div>';return;}root.appendChild(renderHeader());const pages={dashboard:renderDashboard,dues:renderDues,expenses:renderExpenses,balances:renderBalances,settings:renderSettings};if(tab==='rent'||tab==='qattah')tab='dues';if(tab==='members'||tab==='activity')tab='settings';const page=pages[tab]?.();if(page)root.appendChild(page);}

async function init(){
  const hash=location.hash.slice(1);
  if(hash){try{
    const raw=atob(hash);
    let url=null,key=null;
    if(raw.startsWith('{')){const p=JSON.parse(raw);url=p.u;key=p.k||null;}
    else url=raw; // legacy link format (URL only)
    if(isValidFb(url)){DB_URL=url;localStorage.setItem(LS_FB,url);if(key){FB_KEY=key;localStorage.setItem('aca-fbkey',key);}}
  }catch{}}
  if(!DB_URL)DB_URL=localStorage.getItem(LS_FB)||null;
  if(!FB_KEY)FB_KEY=localStorage.getItem('aca-fbkey')||null;
  const local=lsL();
  function bestMembers(a,b){const real=arr=>(arr||[]).filter(m=>m&&m.name&&!m.name.match(/^Person \d+$/)).length;if(real(a)>=real(b))return a;return b;}
  if(DB_URL){
    try{const data=await fbRead();
      if(data){const fbM=data.members||[];const lsM=(local&&local.members)||[];
        const best=bestMembers(fbM,lsM);const realCount=best.filter(m=>m&&m.name&&!m.name.match(/^Person \d+$/)).length;
        data.members=realCount>1?best:INIT.members;}
      state=migrate(data||{});lsS();await fbWrite(state);
    }catch{state=migrate(local);}
    fbSub();
  }else{
    state=migrate(local);
    const defaultCount=state.members.filter(m=>m.name.match(/^Person \d+$/)).length;
    if(defaultCount>1){state.members=INIT.members.map((m,i)=>({...m,...(state.members[i]||{}),name:m.name}));lsS();}
  }
  if(!state.adminHash)isAdmin=true;
  applyDir();
  rollDues();
  rollRecurring();
  render();
  updateManifest();
  fbSnapshot();
}
// Auto-create recurring expenses: from the latest entry of each series, every N months up to now.
// A series stops when its latest entry is unticked. Deleted months are not re-created.
function rollRecurring(){
  const ym=nowM();const latest={};
  state.expenses.forEach(e=>{if(e.type==='monthly'&&e.recurringId){const c=latest[e.recurringId];if(!c||e.month>c.month)latest[e.recurringId]=e;}});
  const toAdd=[];
  Object.values(latest).forEach(tpl=>{if(!tpl.recurring)return;const n=Math.max(1,+tpl.everyN||1);let mk=addM(tpl.month,n),g=0;
    while(mk<=ym&&g<240){toAdd.push({id:gid(),type:'monthly',model:tpl.model||'pool',name:tpl.name,amount:tpl.amount,
      paidBy:null,paidMembers:[],recPaid:'unpaid',recPaidBy:null,note:tpl.note||'',month:mk,recurring:true,
      recurringId:tpl.recurringId,everyN:n,poolSettled:false});mk=addM(mk,n);g++;}});
  if(toAdd.length){
    upd(p=>({...p,expenses:[...p.expenses,...toAdd]}),
      'auto-created '+toAdd.length+' recurring '+(toAdd.length>1?'charges':'charge'));
  }
}
